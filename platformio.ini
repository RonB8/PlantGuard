; ============================================================================
; Smart Plant Guardian — PlatformIO project configuration
; ============================================================================
; Target hardware: ESP32 DevKit V1 (single-board design — see README.md,
; "Design Decisions", for why the OV2640 camera is wired directly to this
; board instead of using a separate ESP32-CAM/AI-Thinker module).
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, colorize

; The AI-Thinker default partition table is too small once ArduinoJson,
; HTTPClient/TLS and the esp32-camera driver are all linked in.
board_build.partitions = huge_app.csv

build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    pololu/VL53L0X@^1.3.1

; ----------------------------------------------------------------------------
; Native environment for hardware-independent unit tests (see test/).
; Only pure logic modules (no Arduino.h / esp-idf headers) are compiled here.
; Run with: pio test -e native
; ----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Iinclude
; Only pure-logic .cpp files are buildable natively — everything else
; (tasks/*, wifi.cpp, camera.cpp, ai_client.cpp, telegram.cpp, main.cpp)
; depends on Arduino/ESP-IDF headers that don't exist on a desktop toolchain.
build_src_filter = -<*> +<moisture_utils.cpp>
test_filter = test_logic
